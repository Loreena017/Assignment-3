<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="utf-8">
    <title>
      Assignment 3: Personal Webpage Design and Implementation
    </title>
    <!--created by Loreena-->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Oswald:wght@200..700&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: "Open Sans", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-variation-settings: "wdth" 100;
        font-size: 16px;
        width: 960px;
        background-color: lightblue;
        align-content: center;
        margin: auto;
      }

      img {
        width: 400px;
      }

      .container {
        display: grid;
        grid-template-columns: 50% 50%;
        gap: 5px;
      }

      .container div {
        background-color: white;
        padding: 20px;
        border: 1px solid black;
        text-align: center;
        margin: 15px;
      }
      
      h1 {
        font-family: "Oswald", sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-size: 30px;
        font-style: normal;
        text-align: left;
        margin: 10px;
        background-color: white;
        border: 1px solid black;
        padding: 20px;
      }
      
      h2 {
        font-family: "Oswald", sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-style: normal;
        text-align: center;
        font-size: 25px;
        margin: 10px;
        margin-left: 20px;
        margin-right: 20px;
      }
      
      footer {
        font-family: "Oswald", sans-serif;
        font-optical-sizing: auto;
        font-weight: 500;
        font-style: normal;
        text-align: center;
        font-size: 35px;
        margin: 20px;
        margin-bottom: 50px;
        background-color: white;
        padding: 20px;
        color: darkblue;
                border: 1px solid black;

      }

      ul {
        color: black;
        text-align: center;
        list-style-type: none;
        margin: 10px;
        padding: 0px;
      }
      
      a {
        text-decoration: none;
      }
      
    a:hover {
        color: red;
        text-decoration: underline;
      }
      
      li {
        display: inline-block;
        vertical-align: top;
        padding: 10px;
        text-align: center;
      }

      nav {
        font-family: "Raleway", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
      }

    </style>
  </head>
  <body>
    <h1 id="site-title">Loreena</h1>
    <nav>
      <ul>
        <li><a href="/">Loreena</a></li>
        <li><a href="/">My works</a></li>
        <li><a href="/">Resume</a></li>
        <li><a href="/">Get in Touch!</a></li>
      </ul>
    </nav>

  </body>
</html>
